<h1>Метрики и навигация</h1><p>Введите пароль, чтобы открыть материалы.</p><form id="unlock-form"><label for="password">Пароль доступа</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required autofocus aria-describedby="message"><button id="toggle" type="button" aria-label="Показать пароль">Показать</button></div><button type="submit" id="submit">Открыть метрики</button><p id="message" role="status" aria-live="polite"></p></form><a href="./">Перейти в открытый прототип <span>↗</span></a><noscript>Для открытия метрик включите JavaScript.</noscript></main><script type="module" src="./metrics-access.js"></script></body></html>
